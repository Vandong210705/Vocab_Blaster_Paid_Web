<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocab Blaster Admin</title>
<style>
body{margin:0;background:#090c1d;color:#eef2ff;font-family:Segoe UI,Arial,sans-serif}
.wrap{max-width:1050px;margin:30px auto;padding:0 18px}
h1{margin-bottom:5px}.muted{color:#95a1c6}
.card{background:#12172f;border:1px solid #27305b;border-radius:16px;padding:18px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:block;color:#aeb8db;font-size:13px}
input{width:100%;margin-top:5px;padding:10px;border-radius:9px;border:1px solid #394677;background:#090d21;color:#fff;box-sizing:border-box}
button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;color:white;background:#6856ff;cursor:pointer}
button.gray{background:#27305b}button.green{background:#168b57}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:9px;border-bottom:1px solid #252d52;text-align:left}
.badge{padding:3px 8px;border-radius:10px;background:#242c52}.paid{background:#125a3d}.pending{background:#6f5212}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><div class="wrap">
<h1>🛠️ Vocab Blaster Admin</h1>
<div class="muted">Bạn có thể đổi giá, thông tin nhận tiền và duyệt giao dịch ngay tại đây.</div>

<div class="card">
  <h3>🔐 Admin key</h3>
  <input id="key" type="password" placeholder="Nhập ADMIN_KEY trên server">
  <p><button id="load">Tải cấu hình & giao dịch</button></p>
</div>

<div class="card">
  <h3>💰 Cấu hình quyền chơi</h3>
  <div class="grid">
    <label>Giá (VNĐ)<input id="priceVnd" type="number" min="0"></label>
    <label>Thời gian quyền chơi (phút)<input id="playMinutes" type="number" min="1"></label>
    <label>Ngân hàng<input id="bankName"></label>
    <label>Số tài khoản<input id="bankAccount"></label>
    <label>Chủ tài khoản<input id="bankAccountName"></label>
    <label>Tiền tố nội dung CK<input id="paymentNotePrefix"></label>
  </div>
  <p><label><input id="freePlay" type="checkbox" style="width:auto"> Cho chơi miễn phí</label></p>
  <button id="save">💾 Lưu cấu hình</button>
</div>

<div class="card">
  <h3>🧾 Giao dịch</h3>
  <button id="refresh" class="gray">↻ Làm mới</button>
  <div style="overflow:auto;margin-top:12px">
    <table><thead><tr><th>Mã</th><th>Số tiền</th><th>Nội dung</th><th>Trạng thái</th><th>Tạo lúc</th><th></th></tr></thead>
    <tbody id="rows"></tbody></table>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const req=async(url,opt={})=>{
 const r=await fetch(url,{...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});
 const d=await r.json(); if(!r.ok) throw new Error(d.error||'API error'); return d;
};
const key=()=>$('key').value.trim();
async function loadAll(){
 try{
  const cfg=await req('/api/admin/config?key='+encodeURIComponent(key()));
  for(const x of ['priceVnd','playMinutes','bankName','bankAccount','bankAccountName','paymentNotePrefix']) $(x).value=cfg[x]??'';
  $('freePlay').checked=!!cfg.freePlay;
  await loadPayments();
 }catch(e){alert(e.message)}
}
async function loadPayments(){
 const data=await req('/api/admin/payments?key='+encodeURIComponent(key()));
 $('rows').innerHTML=data.map(p=>`<tr>
  <td>${p.id}</td><td>${Number(p.amount).toLocaleString('vi-VN')}₫</td><td>${p.note}</td>
  <td><span class="badge ${p.status}">${p.status}</span></td><td>${new Date(p.createdAt).toLocaleString('vi-VN')}</td>
  <td>${p.status==='pending'?`<button class="green" onclick="approve('${p.id}')">Duyệt</button>`:''}</td>
 </tr>`).join('');
}
async function approve(id){
 await req('/api/admin/approve',{method:'POST',body:JSON.stringify({key:key(),id})}); loadPayments();
}
$('load').onclick=loadAll; $('refresh').onclick=loadPayments;
$('save').onclick=async()=>{
 const body={key:key(),priceVnd:Number($('priceVnd').value),playMinutes:Number($('playMinutes').value),
  bankName:$('bankName').value,bankAccount:$('bankAccount').value,bankAccountName:$('bankAccountName').value,
  paymentNotePrefix:$('paymentNotePrefix').value,freePlay:$('freePlay').checked};
 try{await req('/api/admin/config',{method:'POST',body:JSON.stringify(body)});alert('Đã lưu');}catch(e){alert(e.message)}
};
</script>
</div></body></html>
