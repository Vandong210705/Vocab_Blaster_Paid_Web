services:
  - type: web
    name: vocab-blaster-paid-web
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: TOKEN_SECRET
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SEPAY_WEBHOOK_SECRET
        sync: false
